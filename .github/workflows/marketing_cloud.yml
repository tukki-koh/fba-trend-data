name: 週次マーケ社員（クラウド常時稼働）

on:
  schedule:
    # 毎週水曜 AM10:00 JST (UTC 火曜 01:00... = 水01:00 UTC)
    - cron: "0 1 * * 3"
  workflow_dispatch:

# コミットを push するために書き込み権限を付与
permissions:
  contents: write

jobs:
  weekly-marketing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # .vercel はgit管理外のため、プロジェクト識別をenvで渡す（機密ではない）
      VERCEL_ORG_ID: team_mhpSU8lNlVLSr82vewA67lU3
      VERCEL_PROJECT_ID: prj_hay1PQuQJG1kLDXrZVuvXZJTh8zw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存インストール
        run: pip install anthropic

      - name: マーケ更新（llms.txt・ハッシュタグ）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/cloud_marketing_agent.py

      - name: 変更をコミット＆push
        id: commit
        run: |
          # 作者メールはVercelチームメンバー(=アカウント)にする必要がある。
          # 別メールだと TEAM_ACCESS_REQUIRED でデプロイがBLOCKされるため。
          git config user.name  "月足昂誠"
          git config user.email "yuezuangcheng@gmail.com"
          git add public/llms.txt instagram_content/hashtags_current.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "変更なし"
          else
            git commit -m "週次マーケ更新（クラウド自動）$(date +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Vercel本番へデプロイ
        if: steps.commit.outputs.changed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm i -g vercel@latest
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: 失敗時アラート
        if: failure()
        run: echo "⚠️ 週次マーケ社員（クラウド）が失敗しました。Actionsログを確認してください。"
