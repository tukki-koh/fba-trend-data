name: Twitter自動マーケティング（週3回）

on:
  schedule:
    # 月曜 AM8:00 JST = UTC 日曜 23:00 → 週次トレンド速報
    - cron: "0 23 * * 0"
    # 水曜 PM8:00 JST = UTC 水曜 11:00 → 注目商品ピックアップ
    - cron: "0 11 * * 3"
    # 金曜 PM7:00 JST = UTC 金曜 10:00 → 週末仕込みヒント
    - cron: "0 10 * * 5"
  # 手動実行（テスト用）
  workflow_dispatch:
    inputs:
      tweet_mode:
        description: 'monday / wednesday / friday'
        required: false
        default: 'monday'

jobs:
  tweet:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: 依存パッケージのインストール
        run: pip install -r scripts/requirements.txt

      - name: ツイートモードを自動判定
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.tweet_mode }}" >> $GITHUB_OUTPUT
          else
            DOW=$(date +%u)   # 1=月, 3=水, 5=金
            if   [ "$DOW" = "1" ]; then echo "mode=monday"    >> $GITHUB_OUTPUT
            elif [ "$DOW" = "3" ]; then echo "mode=wednesday"  >> $GITHUB_OUTPUT
            elif [ "$DOW" = "5" ]; then echo "mode=friday"     >> $GITHUB_OUTPUT
            else                        echo "mode=monday"     >> $GITHUB_OUTPUT
            fi
          fi

      - name: Twitter自動投稿
        env:
          TWITTER_API_KEY:       ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET:    ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN:  ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEXT_PUBLIC_SITE_URL:  ${{ secrets.SITE_URL }}
          TWEET_MODE:            ${{ steps.mode.outputs.mode }}
        run: python scripts/post_twitter.py

      - name: 失敗時アラート
        if: failure()
        run: echo "⚠️ Twitter投稿失敗。APIキーまたはレート制限を確認してください。"
