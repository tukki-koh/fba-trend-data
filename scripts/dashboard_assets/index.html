<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FBA TREND RADAR ／ AIオフィス LIVE 3D</title>
<style>
:root{--night:#04060d;--edge:#1e2c47;--tx:#e6ecfa;--mut:#8497bd;--mut2:#54648a;
 --cyan:#22d3ee;--amber:#f5b642;--green:#34d399;--red:#ff5d6c;--violet:#a78bfa;}
*{box-sizing:border-box}
body{margin:0;background:var(--night);color:var(--tx);
 font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;font-size:13px;overflow-x:hidden}
.mono{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1560px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
 background:linear-gradient(180deg,#0c1424,#080d18);border:1px solid var(--edge);
 border-radius:12px;padding:10px 16px;margin-bottom:14px;position:relative;overflow:hidden}
header:before{content:"";position:absolute;left:0;top:0;height:2px;width:100%;
 background:linear-gradient(90deg,transparent,var(--cyan),var(--amber),transparent);opacity:.8}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:16px}
.blogo{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font-size:15px;
 background:linear-gradient(145deg,#1b2b4d,#0d1526);border:1px solid #2b4270;box-shadow:0 0 16px rgba(34,211,238,.35) inset}
.tag{font-size:10px;color:var(--mut);letter-spacing:.18em;font-weight:700}
.hud{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.hd{display:flex;flex-direction:column;line-height:1.15}
.hd .l{font-size:9.5px;color:var(--mut2);letter-spacing:.1em}
.hd .v{font-size:17px;font-weight:800}
.v.cy{color:var(--cyan)}.v.am{color:var(--amber)}.v.gr{color:var(--green)}.v.vi{color:var(--violet)}
.live{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;color:var(--green);
 background:rgba(52,211,153,.10);border:1px solid rgba(52,211,153,.4);padding:5px 11px;border-radius:999px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.stage{display:grid;grid-template-columns:1fr 310px;gap:14px;align-items:start}

/* ── 3Dシーン ── */
.scene{position:relative;border:1px solid var(--edge);border-radius:14px;overflow:hidden;aspect-ratio:16/9;
 background:#04060d;box-shadow:0 20px 60px rgba(0,0,0,.6);cursor:grab}
.scene.grabbing{cursor:grabbing}
.scene canvas{display:block;width:100%!important;height:100%!important}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.vig{position:absolute;inset:0;pointer-events:none;z-index:3;
 background:radial-gradient(ellipse 85% 75% at 50% 50%,transparent 62%,rgba(2,4,10,.5) 100%)}
.grain{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:.05;mix-blend-mode:overlay;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.loading{position:absolute;inset:0;display:grid;place-items:center;z-index:10;color:#9be7f5;font-weight:800;letter-spacing:.2em;
 font-family:"SF Mono",ui-monospace,Menlo,monospace;background:#04060d}
.loading.off{display:none}

/* ネームタグ（CSS2D） */
.lb{display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap;transform:translateY(-100%);pointer-events:auto}
.lb .nm{font-size:10.5px;font-weight:800;color:#e9fbff;letter-spacing:.04em;background:rgba(4,10,22,.72);
 border:1px solid rgba(90,220,255,.45);padding:2px 8px;border-radius:4px;box-shadow:0 0 12px rgba(34,211,238,.25)}
.lb .st{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:8.5px;font-weight:800;letter-spacing:.12em;color:#9be7f5;display:flex;align-items:center;gap:5px}
.lb .st i{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 7px var(--green);animation:blink 1.4s infinite}
.lb:after{content:"";width:1px;height:var(--ll,12px);background:linear-gradient(180deg,rgba(150,235,255,.9),transparent)}
.lb.run .st i{background:var(--cyan);box-shadow:0 0 7px var(--cyan);animation-duration:.5s}
.lb.work .st i{background:var(--green);box-shadow:0 0 7px var(--green);animation-duration:2s}
/* 休憩中・仮眠中は主張を弱める */
.lb.rest,.lb.nap{opacity:.72}
.lb.rest .st,.lb.nap .st{color:#9aa6c4}
.lb.rest .st i{background:#5d6b8c;box-shadow:none;animation:none}
.lb.nap .st i{background:var(--violet);box-shadow:0 0 6px var(--violet);animation:blink 3.2s infinite}
.lb.rest .nm,.lb.nap .nm{border-color:rgba(120,140,180,.4);box-shadow:none;font-size:9.5px}
.lb.nap .nm:after{content:" z z";color:var(--violet);font-weight:700}
.lb.err .st{color:#ffb3bc}.lb.err .st i{background:var(--red);box-shadow:0 0 7px var(--red)}
.lb.err .nm{border-color:rgba(255,93,108,.55)}
.lb .tip{display:none;position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;
 background:rgba(4,10,22,.95);border:1px solid rgba(90,220,255,.4);border-radius:6px;padding:6px 9px;font-size:10px;color:#cfe6ff;
 text-align:left;line-height:1.5;white-space:nowrap}
.lb:hover .tip{display:block}.lb .tip b{color:#9be7f5}
.lb.far .st{display:none}.lb.far .nm{font-size:9px;padding:1px 6px}
.lb.hide{display:none}
/* 部屋の看板 */
.rsign{font-size:11px;transition:opacity .35s;font-weight:800;letter-spacing:.16em;color:#8fd8e8;white-space:nowrap;
 background:rgba(4,10,22,.7);border:1px solid rgba(90,220,255,.28);border-radius:5px;padding:3px 10px;pointer-events:none}
.rsign.v{color:#c4b5fd;border-color:rgba(167,139,250,.32)}

/* カメラUI・凡例・時計 */
.cam{position:absolute;left:12px;top:12px;z-index:30;display:flex;gap:6px;flex-wrap:wrap;align-items:center;
 background:rgba(6,11,22,.82);border:1px solid var(--edge);border-radius:9px;padding:7px 9px}
.cam button{font:inherit;font-size:11px;font-weight:800;color:#a9bfe0;cursor:pointer;
 background:#0d1626;border:1px solid #26395c;border-radius:6px;padding:4px 10px;transition:.15s}
.cam button:hover{background:#16243c;color:#dff0ff;border-color:#3c5c8c}
.cam button.on{background:rgba(34,211,238,.16);color:#bff4ff;border-color:rgba(34,211,238,.6)}
.cam .hint{font-size:10px;color:var(--mut2);margin-left:4px}
.legend{position:absolute;left:12px;bottom:12px;z-index:30;display:flex;gap:6px;flex-wrap:wrap;max-width:72%}
.lg{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;color:#cfe6ff;
 background:rgba(4,10,22,.78);border:1px solid var(--edge);border-radius:999px;padding:4px 10px}
.lg b{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:9.5px;color:#9be7f5}
.lg.lit{border-color:rgba(34,211,238,.45);box-shadow:0 0 12px rgba(34,211,238,.18)}
.clock{position:absolute;right:12px;bottom:12px;z-index:30;font-family:"SF Mono",ui-monospace,Menlo,monospace;
 font-size:12px;font-weight:800;color:#9be7f5;background:rgba(4,10,22,.78);border:1px solid rgba(34,211,238,.35);
 padding:5px 11px;border-radius:8px;letter-spacing:.1em}
.fps{position:absolute;right:12px;top:12px;z-index:30;font-family:"SF Mono",ui-monospace,Menlo,monospace;
 font-size:10px;color:var(--mut2);background:rgba(4,10,22,.7);border:1px solid var(--edge);padding:3px 8px;border-radius:6px}

/* サイドパネル */
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:14px}
.panel{background:linear-gradient(180deg,#0c1424,#080e1a);border:1px solid var(--edge);border-radius:12px;padding:12px 13px}
.ptitle{font-size:11px;font-weight:800;color:var(--mut);letter-spacing:.1em;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.kbox{background:#0a1120;border:1px solid var(--edge);border-radius:8px;padding:8px 10px}
.kbox .l{font-size:9.5px;color:var(--mut2)}.kbox .v{font-size:17px;font-weight:800;margin-top:2px}
.sect{font-size:10px;color:var(--mut);margin:11px 0 6px;font-weight:700;letter-spacing:.06em}
.task{display:flex;align-items:center;gap:7px;background:#0a1120;border:1px solid var(--edge);border-radius:6px;padding:6px 8px;margin-bottom:4px;font-size:11px}
.task.done{opacity:.7}
.tg{font-size:9px;font-weight:800;padding:1px 5px;border-radius:3px;flex:0 0 auto;background:rgba(34,211,238,.14);color:#9be7f5;border:1px solid rgba(34,211,238,.3)}
.tg.g{background:rgba(52,211,153,.13);color:#8ff0cb;border-color:rgba(52,211,153,.32)}
.tg.a{background:rgba(245,182,66,.13);color:#ffd899;border-color:rgba(245,182,66,.32)}
.tg.r{background:rgba(255,93,108,.13);color:#ffb3bc;border-color:rgba(255,93,108,.35)}
.ttx{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tago{font-size:9.5px;color:var(--mut2);flex:0 0 auto}
.foot{margin-top:14px;text-align:center;font-size:10.5px;color:var(--mut2)}
@media(max-width:1180px){.stage{grid-template-columns:1fr}.side{position:static}}
</style>

<body><div class="wrap">

<header>
  <div class="brand"><span class="blogo">📡</span>
    <div>FBA TREND RADAR<div class="tag">AI OFFICE ／ LIVE 3D MONITOR</div></div></div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {CSS2DRenderer, CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';

const LBL ={run:'RUNNING',work:'WORKING',error:'ERROR',rest:'BREAK',nap:'SLEEPING'};
const LBLJ={run:'実行中',work:'作業中',error:'要確認',rest:'休憩中',nap:'仮眠中'};
const short=n=>n.replace(/（.*?）/g,'').replace(/担当$/,'');
const rnd=(seed)=>{let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}};

/* ───────── 基本セットアップ ───────── */
const wrap=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
/* 解像度は1.5倍まで。2倍にすると塗りつぶし負荷が倍近くなりカクつく */
let PR=Math.min(devicePixelRatio,1.5);
renderer.setPixelRatio(PR);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
/* 影は静止物だけ。毎フレーム影を描き直さないことが最大の高速化 */
renderer.shadowMap.autoUpdate=false;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.0;
wrap.insertBefore(renderer.domElement, wrap.firstChild);
const labelR=new CSS2DRenderer({element:document.getElementById('labels')});

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x05080f);
scene.fog=new THREE.FogExp2(0x070b14,0.035);
const camera=new THREE.PerspectiveCamera(48,16/9,0.1,80);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.06;
controls.minDistance=1.5; controls.maxDistance=18; controls.maxPolarAngle=1.52; controls.minPolarAngle=0.12;
controls.autoRotateSpeed=0.5;
const VIEWS={
  cine :{p:[-5.2,1.75,2.6],t:[0.6,0.95,-3.2]},
  front:{p:[0,1.7,5.6],  t:[0,1.0,-3.6]},
  over :{p:[0.5,8.2,3.0],t:[0,0.6,-5.0]},
  rooms:{p:[0,3.0,1.6],  t:[0,1.15,-10.8]},  /* 奥の休憩室・仮眠室の両方を正面に収める */
  left :{p:[-6.8,2.2,-1.0],t:[0,1.0,-4.0]},
  right:{p:[6.8,2.2,-1.0], t:[0,1.0,-4.0]},
};
function setView(v){camera.position.set(...v.p);controls.target.set(...v.t);controls.update()}
setView(VIEWS.cine);

/* ───────── ジオメトリのキャッシュ ─────────
   同じ寸法の箱・円柱を使い回す。以前は生成のたびに新しいBoxGeometryを
   作っていて800個以上のジオメトリがGPUに積まれ、これがラグの主因だった。 */
const _geo=new Map();
function gBox(w,h,d){const k=`b${w}_${h}_${d}`;let g=_geo.get(k);if(!g){g=new THREE.BoxGeometry(w,h,d);_geo.set(k,g)}return g}
function gCyl(r,h,s=12){const k=`c${r}_${h}_${s}`;let g=_geo.get(k);if(!g){g=new THREE.CylinderGeometry(r,r,h,s);_geo.set(k,g)}return g}
const box=(w,h,d,m,shadow=false)=>{const me=new THREE.Mesh(gBox(w,h,d),m);if(shadow)me.castShadow=true;return me};
const cyl=(r,h,m,s=12)=>new THREE.Mesh(gCyl(r,h,s),m);

/* ───────── マテリアル ───────── */
function carpetTex(){
  const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  g.fillStyle='#1b222c';g.fillRect(0,0,256,256);
  const r=rnd(7);for(let i=0;i<6000;i++){const v=40+r()*40|0;g.fillStyle=`rgb(${v-6},${v},${v+8})`;g.fillRect(r()*256,r()*256,1.5,1.5)}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(14,16);t.colorSpace=THREE.SRGBColorSpace;return t;
}
function screenTex(seed,kind){
  const c=document.createElement('canvas');c.width=256;c.height=160;const g=c.getContext('2d');const r=rnd(seed);
  g.fillStyle='#0a1826';g.fillRect(0,0,256,160);
  g.fillStyle='#132a40';g.fillRect(0,0,256,18);
  g.fillStyle='#5fd6ff';g.fillRect(8,6,40,6);
  if(kind===0){
    g.strokeStyle='#1d3d5a';g.lineWidth=1;for(let y=30;y<160;y+=22){g.beginPath();g.moveTo(10,y);g.lineTo(246,y);g.stroke()}
    g.strokeStyle='#7fe6ff';g.lineWidth=2;g.beginPath();let y=120;g.moveTo(10,y);
    for(let x=10;x<=246;x+=12){y=Math.max(30,Math.min(150,y+(r()-.5)*40));g.lineTo(x,y)}g.stroke();
    for(let i=0;i<10;i++){g.fillStyle=`rgba(95,214,255,${.25+r()*.5})`;g.fillRect(14+i*23,150-r()*90,14,90)}
  }else if(kind===1){
    for(let i=0;i<8;i++){g.fillStyle=i%2?'#0d1f31':'#0b1a2a';g.fillRect(6,28+i*16,244,15);
      g.fillStyle='#9fdcff';g.fillRect(12,33+i*16,40+r()*50,5);g.fillStyle='#e6f7ff';g.fillRect(140,33+i*16,20+r()*60,5);
      g.fillStyle=r()>.5?'#34d399':'#f5b642';g.fillRect(228,33+i*16,14,5)}
  }else{
    for(let i=0;i<11;i++){g.fillStyle=['#7fe6ff','#cfe6ff','#8fb6d8','#34d399'][r()*4|0];g.fillRect(10+(r()>.7?20:0),28+i*12,30+r()*160,4)}
  }
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
/* 画面テクスチャは4種類を使い回す（毎席で作ると重い） */
const SCREENS=[screenTex(11,0),screenTex(23,1),screenTex(37,2),screenTex(51,0)];
const SCREEN_MATS=SCREENS.map(t=>new THREE.MeshBasicMaterial({map:t,toneMapped:false,color:0xb8c8d8}));
const SCREEN_OFF=new THREE.MeshBasicMaterial({color:0x16202c,toneMapped:false});

const M={
  floor:new THREE.MeshStandardMaterial({color:0x8e97a3,map:carpetTex(),roughness:.96,metalness:0}),
  wall:new THREE.MeshStandardMaterial({color:0x2a3340,roughness:.92}),
  ceil:new THREE.MeshStandardMaterial({color:0x151a22,roughness:.95}),
  pipe:new THREE.MeshStandardMaterial({color:0x6c7784,roughness:.45,metalness:.75}),
  duct:new THREE.MeshStandardMaterial({color:0x8b96a3,roughness:.5,metalness:.7}),
  beam:new THREE.MeshStandardMaterial({color:0x2f3742,roughness:.8,metalness:.3}),
  col:new THREE.MeshStandardMaterial({color:0x39424e,roughness:.9}),
  desk:new THREE.MeshStandardMaterial({color:0x7d858f,roughness:.85,metalness:0}),
  deskLeg:new THREE.MeshStandardMaterial({color:0x9aa2ab,roughness:.6,metalness:.3}),
  chair:new THREE.MeshStandardMaterial({color:0x1d2229,roughness:.9}),
  chairMetal:new THREE.MeshStandardMaterial({color:0x2b3138,roughness:.4,metalness:.7}),
  bezel:new THREE.MeshStandardMaterial({color:0x1b2029,roughness:.55,metalness:.35}),
  lampBody:new THREE.MeshStandardMaterial({color:0x22262c,roughness:.5,metalness:.6}),
  lampOff:new THREE.MeshStandardMaterial({color:0x1d232c,roughness:.7,emissive:0x0e1a26,emissiveIntensity:.6}),
  glassFrame:new THREE.MeshStandardMaterial({color:0x1a1f27,roughness:.6,metalness:.4}),
  glass:new THREE.MeshPhysicalMaterial({color:0x8fb8dc,transparent:true,opacity:.09,roughness:.08,metalness:0,side:THREE.DoubleSide}),
  plant:new THREE.MeshStandardMaterial({color:0x1f4a33,roughness:.95}),
  pot:new THREE.MeshStandardMaterial({color:0x2a2f36,roughness:.8}),
  drawer:new THREE.MeshStandardMaterial({color:0x9aa2ab,roughness:.7,metalness:.05}),
  sofa:new THREE.MeshStandardMaterial({color:0x33404f,roughness:.95}),
  sofaSeat:new THREE.MeshStandardMaterial({color:0x3d4b5c,roughness:.95}),
  bed:new THREE.MeshStandardMaterial({color:0x242b36,roughness:.95}),
  sheet:new THREE.MeshStandardMaterial({color:0x4a5568,roughness:.95}),
  pillow:new THREE.MeshStandardMaterial({color:0x8a96a8,roughness:.95}),
};

/* ───────── 部屋 ───────── */
const ROOM={w:17,d:24,h:3.4,zc:-1};
const BACK=ROOM.zc-ROOM.d/2;          // -13
{
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w,ROOM.d),M.floor);

const SKY={tex:null,mats:[]};
function windowWall(cx,cy,cz,w,h,ry){
  const g=new THREE.Group();g.position.set(cx,cy,cz);g.rotation.y=ry;
  const mat=new THREE.MeshBasicMaterial({color:0x35506e,toneMapped:false,fog:false});
  SKY.mats.push({mat,aspect:w/h});
  g.add(new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat));
  const n=Math.max(1,Math.round(w/2.6));
  for(let i=0;i<=n;i++){const f=box(.08,h+.1,.1,M.glassFrame);f.position.set(-w/2+i*(w/n),0,.04);g.add(f)}
  const top=box(w+.1,.12,.1,M.glassFrame);top.position.set(0,h/2,.04);g.add(top);
  const bot=box(w+.1,.16,.16,M.glassFrame);bot.position.set(0,-h/2,.06);g.add(bot);
  scene.add(g);
}
new THREE.TextureLoader().load('/assets/sky.jpg?v=2',t=>{
  t.colorSpace=THREE.SRGBColorSpace;
  const src=t.image.width/t.image.height;
  for(const {mat,aspect} of SKY.mats){
    const c=t.clone();c.needsUpdate=true;
    // 面より横長なら縦を、縦長なら横をクロップして歪みを消す
    if(aspect>src){c.repeat.set(1,src/aspect);c.offset.set(0,(1-src/aspect)*.55)}
    else{c.repeat.set(aspect/src,1);c.offset.set((1-aspect/src)*.5,0)}
    mat.map=c;mat.color.set(0xffffff);mat.needsUpdate=true;
  }
  renderer.shadowMap.needsUpdate=true;
});

const holoVert=`varying vec3 vN;varying vec3 vW;varying vec3 vV;
void main(){vec4 wp=modelMatrix*vec4(position,1.0);vW=wp.xyz;vN=normalize(mat3(modelMatrix)*normal);
 vV=normalize(cameraPosition-wp.xyz);gl_Position=projectionMatrix*viewMatrix*wp;}`;
const holoFrag=`uniform float uT;uniform vec3 uC;uniform float uO;uniform float uGl;
varying vec3 vN;varying vec3 vW;varying vec3 vV;
float hash(float n){return fract(sin(n)*43758.5453);}
void main(){
 float fr=pow(1.0-abs(dot(normalize(vN),normalize(vV))),2.2);
 float scan=smoothstep(.45,.55,sin(vW.y*70.0-uT*5.0)*.5+.5)*.30;
 float band=smoothstep(.0,.08,abs(fract(vW.y*.9-uT*.25)-.5))*.25+.75;
 float fl=1.0-.35*step(.96,hash(floor(uT*9.0)))*step(.5,hash(floor(uT*37.0)));
 float gl=1.0+uGl*(.5+.5*sin(uT*7.0));
 float a=(.34+fr*.55+scan*.3)*band*uO*fl;
 vec3 c=uC*(.42+fr*.85)*gl;
 gl_FragColor=vec4(c,a);}`;
const CY=new THREE.Color(0x5fd7ff), RD=new THREE.Color(0xff5a72), VI=new THREE.Color(0x9b8cf0);

function makeFigure(){
  const mat=new THREE.ShaderMaterial({vertexShader:holoVert,fragmentShader:holoFrag,transparent:true,
    depthWrite:false,blending:THREE.NormalBlending,side:THREE.FrontSide,
    uniforms:{uT:{value:0},uC:{value:CY.clone()},uO:{value:1},uGl:{value:0}}});
  const F={root:new THREE.Group(),body:new THREE.Group(),mat};
  F.root.add(F.body);
  const part=(geo,parent,pos,rot,scale)=>{const m=new THREE.Mesh(geo,mat);m.position.set(...pos);
    if(rot)m.rotation.set(...rot);if(scale)m.scale.set(...scale);parent.add(m);return m};

  const torso=new THREE.Group();torso.position.y=.02;F.body.add(torso);F.torso=torso;
  part(G.torso,torso,[0,.36,0],null,[1.12,1,.72]);
  part(G.neck,torso,[0,.62,-.01]);
  const head=new THREE.Group();head.position.set(0,.72,-.02);torso.add(head);F.head=head;
  part(G.head,head,[0,.08,0],null,[1,1.12,1.02]);

    part(G.farm,el,[0,-.12,0]);part(G.hand,el,[0,-.25,0]);
  }
  F.hip=[];F.knee=[];
  for(const sx of [-1,1]){
    const hip=new THREE.Group();hip.position.set(sx*.11,.04,0);F.body.add(hip);F.hip.push(hip);
    part(G.thigh,hip,[0,-.21,0]);
    const knee=new THREE.Group();knee.position.set(0,-.42,0);hip.add(knee);F.knee.push(knee);
    part(G.shin,knee,[0,-.21,0]);part(G.foot,knee,[0,-.42,-.06]);
  }
  const N=26,pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*.5;pos[i*3+1]=Math.random()*1.2;pos[i*3+2]=(Math.random()-.5)*.5}
  const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  F.pts=new THREE.Points(pg,new THREE.PointsMaterial({color:0x9fe4ff,size:.013,transparent:true,
    opacity:.5,blending:THREE.AdditiveBlending,depthWrite:false}));

  const el=document.createElement('div');el.className='lb';

  F.seedT=Math.random()*10;F.pose='work';
  scene.add(F.root);
  return F;
}
function setPose(F,name){
  const p=POSE[name];F.pose=name;
  F.torso.rotation.x=p.torso;
  F.body.rotation.x=p.lay;
  for(let i=0;i<2;i++){F.sh[i].rotation.x=p.sh;F.el[i].rotation.x=p.el;
    F.hip[i].rotation.x=p.hip;F.knee[i].rotation.x=p.knee}
  // 寝かせたぶん体が床へ潜らないよう持ち上げる
  F.body.position.y=name==='nap'?.18:0;   // 寝かせた体をマットレスの上に乗せる
  F.labelObj.position.y=name==='nap'?.62:1.02;
}

/* ───────── 空気中のホコリ ───────── */
{
  const N=350,pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*ROOM.w;pos[i*3+1]=Math.random()*ROOM.h;pos[i*3+2]=ROOM.zc+(Math.random()-.5)*ROOM.d}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.userData.dust=new THREE.Points(g,new THREE.PointsMaterial({color:0x9fc4e6,size:.015,
    transparent:true,opacity:.25,blending:THREE.AdditiveBlending,depthWrite:false}));
  scene.add(scene.userData.dust);
}

/* ───────── ポストプロセス ───────── */
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(1,1),.36,.55,.95);composer.addPass(bloom);
composer.addPass(new OutputPass());
function resize(){
  const w=wrap.clientWidth,h=wrap.clientHeight;
  renderer.setSize(w,h,false);composer.setSize(w,h);labelR.setSize(w,h);
  camera.aspect=w/h;camera.updateProjectionMatrix();
  renderer.shadowMap.needsUpdate=true;
}
new ResizeObserver(resize).observe(wrap);resize();

/* ───────── 状態の反映 ───────── */
const figures=[];
/* 「あと3日…」のように日単位で先なら仮眠、当日中に動くなら休憩室で待機 */
function offDuty(m){return /あと\s*\d+\s*日/.test(m.next||'')?'nap':'rest'}

function applyState(F,m,i,slots){
  const raw=m.state;
  // 席にいるのは「実行中」＋「直近30分以内に完了（後処理中）」＋「要確認」。
  // それ以外は手が空いているので休憩室か仮眠室へ送る。
  const st = raw==='run'   ? 'run'
           : raw==='error' ? 'error'
           : (raw==='ok' && m.recent) ? 'work'
           : offDuty(m);
  const dutyOn = st==='run'||st==='work';
  const changed = F.state!==st;
  F.state=st;

  if(changed){
    if(st==='nap'){
      const s=NAP_SLOTS[slots.nap++ % NAP_SLOTS.length];
      // lay=+π/2 で仰向け、rootをY180°回して頭を枕側(-z)へ向ける
      F.root.position.set(s.x,s.y,s.z);F.root.rotation.y=Math.PI;setPose(F,'nap');
    }else if(st==='rest'){
      const s=REST_SLOTS[slots.rest++ % REST_SLOTS.length];
      F.root.position.set(s.x,s.y,s.z);F.root.rotation.y=s.ry;setPose(F,'rest');
    }else{
      const s=SEATS[i];
      // 椅子の座面。机のある向きへ体を向ける
      const fwd=new THREE.Vector3(0,0,.62).applyAxisAngle(new THREE.Vector3(0,1,0),s.ry);
      F.root.position.set(s.x+fwd.x,.47,s.z+fwd.z);F.root.rotation.y=s.ry;setPose(F,'work');
      F.labelObj.position.y=1.02+(3-(i%4))*.26;   // 奥の席ほど名札を高く＝重なり防止
    }
    renderer.shadowMap.needsUpdate=true;
  }

  const col = st==='error'?RD : (st==='nap'||st==='rest')?VI : CY;
  F.mat.uniforms.uC.value.copy(col);
  F.mat.uniforms.uO.value = st==='run'?.9 : st==='work'?.82 : st==='error'?.8 : st==='rest'?.34 : .26;
  F.mat.uniforms.uGl.value = st==='run'?.6:0;
  F.pts.visible = dutyOn;

  // 机の灯りは、その席の主が本当に稼働しているときだけ点ける
  const ws=stations[i];
  if(ws){
    const on=dutyOn;
    ws.userData.mon.userData.screen.material = on?SCREEN_MATS[ws.userData.kind%4]:SCREEN_OFF;
    if(ws.userData.lamp)ws.userData.lamp.userData.bulb.material.color.set(on?0xdff3ff:0x223040);
  }

  const el=F.label;
  el.className='lb '+(st==='run'?'run':st==='work'?'work':st==='error'?'err':st==='rest'?'rest':'nap');
  el.querySelector('.nm').textContent=short(m.name);
  el.querySelector('.st span').textContent=LBL[st]||'';
  el.querySelector('.tip').innerHTML=
    `<b>${m.name}</b><br>${m.dept}<br>${m.role||''}<br>状態: ${LBLJ[st]||''} ／ 最終: ${m.last||'-'}<br>次回: ${m.next}`;
}

async function tick(){
 try{
  const s=await(await fetch('/api/state',{cache:'no-store'})).json();
  const k=s.kpi||{};
  const slots={rest:0,nap:0};
  const depts=s.depts||[];const leg=[];let i=0,offCnt=0;
  depts.forEach(d=>{
    const on=d.members.filter(m=>m.state==='run'||(m.state==='ok'&&m.recent)).length;
    leg.push(`<span class="lg ${on?'lit':''}">${d.icon} ${d.dept}<b>${on}/${d.members.length}</b></span>`);
    d.members.forEach(m=>{
      if(!figures[i])figures[i]=makeFigure();
      applyState(figures[i],{...m,dept:d.dept},i,slots);
      if(figures[i].state==='rest'||figures[i].state==='nap')offCnt++;
      i++;
    });
  });
  // 稼働中の社員にだけライトを貸す（先着3名）
  let li=0;
  for(const F of figures)if(F)F.light=null;
  for(const want of ['run','work'])
  for(const F of figures){
    if(!F||F.light)continue;
    if(F.state===want&&li<LIGHT_POOL.length){
      const L=LIGHT_POOL[li++];F.light=L;
      F.root.getWorldPosition(L.position);L.position.y+=.5;
      L.color.set(0x4fc3ff);L.intensity=F.state==='run'?2.6:1.7;
    }
  }
  for(let j=li;j<LIGHT_POOL.length;j++)LIGHT_POOL[j].intensity=0;

  hemp.textContent=(k.resident||0)+'名'; hrun.textContent=(s.running_now||0)+'名';
  hdesk.textContent=(s.at_desk??0)+'名'; hok.textContent=(s.healthy??0)+'名'; hoff.textContent=offCnt+'名';
  hact.textContent=(s.today_activity||0)+'件'; hclock.textContent=s.hhmm||'–'; sclock.textContent=s.hhmm||'–';
  legend.innerHTML=leg.join('');
  document.getElementById('kpis').innerHTML=[
   ['有効会員',(k.active||0)+'名'],['トライアル',(k.trial||0)+'名'],['配信レポート',(k.reports||0)+'本'],['成功率',(k.success_rate||0)+'%'],
  ].map(([l,v])=>`<div class="kbox"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('');
  const next=[];depts.forEach(d=>d.members.forEach(m=>next.push({who:d.dept,name:m.name,next:m.next,state:m.state})));
  document.getElementById('board').innerHTML=
   `<div class="sect">▸ 次の出社予定</div>`+
   next.slice(0,6).map(t=>`<div class="task"><span class="tg ${t.state==='error'?'r':'a'}">${t.who.slice(0,4)}</span><span class="ttx">${short(t.name)}</span><span class="tago">${t.next}</span></div>`).join('')+
   `<div class="sect">✓ 完了した仕事</div>`+
   ((s.feed||[]).map(f=>`<div class="task done"><span class="tg g">${f.who}</span><span class="ttx">${f.text}</span><span class="tago">${f.ago}</span></div>`).join('')||'<div class="task">履歴を取得中…</div>');
 }catch(e){console.warn(e)}
}
tick();setInterval(tick,8000);

/* ───────── カメラUI ───────── */
document.querySelectorAll('.cam button[data-v]').forEach(b=>b.addEventListener('click',()=>{
  controls.autoRotate=false;autoBtn.classList.remove('on');setView(VIEWS[b.dataset.v])}));
resetBtn.addEventListener('click',()=>{controls.autoRotate=false;autoBtn.classList.remove('on');setView(VIEWS.cine)});
autoBtn.addEventListener('click',()=>{controls.autoRotate=!controls.autoRotate;autoBtn.classList.toggle('on',controls.autoRotate)});
renderer.domElement.addEventListener('pointerdown',()=>wrap.classList.add('grabbing'));
addEventListener('pointerup',()=>wrap.classList.remove('grabbing'));

/* ───────── アニメーション ───────── */
const clock=new THREE.Clock();
let frames=0,acc=0,fpsT=0,fpsN=0,lowStreak=0;
const _v=new THREE.Vector3();
function animate(){
  requestAnimationFrame(animate);
  /* getElapsedTime() は内部で getDelta() を消費するため、
     両方呼ぶと dt が 0 になる。dt だけ取って自前で積算する。 */
  const dt=Math.min(clock.getDelta(),.05);
  acc+=dt;const t=acc;
  controls.update();

  for(const F of figures){
    if(!F)continue;
    F.mat.uniforms.uT.value=t+F.seedT;
    const ph=t+F.seedT;
    if(F.state==='run'||F.state==='work'){
      const sp=F.state==='run'?13:7.5, amp=F.state==='run'?.10:.07;
      F.el[0].rotation.x=POSE.work.el+Math.sin(ph*sp)*amp;
      F.el[1].rotation.x=POSE.work.el+Math.sin(ph*sp+Math.PI)*amp;
      F.head.rotation.x=Math.sin(ph*.9)*.05;F.head.rotation.y=Math.sin(ph*.5)*.11;
      F.torso.scale.y=1+Math.sin(ph*1.3)*.008;
      const p=F.pts.geometry.attributes.position.array;
      for(let i=1;i<p.length;i+=3){p[i]+=dt*.35;if(p[i]>1.2)p[i]=0}
      F.pts.geometry.attributes.position.needsUpdate=true;
      if(F.light)F.light.intensity=(F.state==='run'?2.6:1.7)+Math.sin(t*6+F.seedT)*.25;
    }else if(F.state==='error'){
      F.torso.rotation.z=(Math.random()-.5)*.03;   // 小刻みに震えるだけ。作業はしない
    }else if(F.state==='rest'){
      F.torso.scale.y=1+Math.sin(ph*.55)*.012;     // ゆっくり呼吸
      F.head.rotation.y=Math.sin(ph*.22)*.3;       // たまに周りを見る
    }else{ /* nap */
      F.torso.scale.y=1+Math.sin(ph*.38)*.02;      // 寝息
    }
  }
  const d=scene.userData.dust;if(d){d.rotation.y=Math.sin(t*.02)*.02;d.position.y=Math.sin(t*.15)*.06}

  composer.render();labelR.render(scene,camera);

  if(++frames%20===0){
    for(const F of figures){if(!F)continue;
      F.root.getWorldPosition(_v);const dd=_v.distanceTo(camera.position);
      F.label.classList.toggle('far',dd>9);F.label.classList.toggle('hide',dd>14)}
    for(const {o,el} of ROOM_SIGNS){
      o.getWorldPosition(_v);el.style.opacity=_v.distanceTo(camera.position)>15?'0':'1';}
  }
  // FPS表示と、落ちている場合の自動減解像度
  fpsN++;fpsT+=dt;
  if(fpsT>=1){
    const fps=fpsN/fpsT;document.getElementById('fps').textContent=fps.toFixed(0)+' FPS';
    if(fps<45&&PR>0.85){if(++lowStreak>=2){PR=Math.max(.85,PR-.25);renderer.setPixelRatio(PR);resize();lowStreak=0}}
    else lowStreak=0;
    fpsN=0;fpsT=0;
  }
  if(frames===2){document.getElementById('loading').classList.add('off');renderer.shadowMap.needsUpdate=true}
}
window.__dbg={figures,bloom,scene,renderer,camera,controls,THREE,setPose,POSE};
animate();
</script>
